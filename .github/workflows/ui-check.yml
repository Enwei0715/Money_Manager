name: UI check

# 在模擬器上操作測試版 App、逐頁截圖（tools/ui/walk.py），截圖推到 ui-shots 分支供檢查
on:
  push:
    branches: ["ccr-*"]
    paths-ignore: ["RELEASE_NOTES.md", "research_notes/**", "reports/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI walk on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096 -cores 4
          script: |
            adb install -r app/build/outputs/apk/github/debug/app-github-debug.apk
            SHOTS=shots python3 tools/ui/walk.py || true

      - name: Publish screenshots to ui-shots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          # 一併發佈 Room 匯出的資料庫結構（app/schemas），供日後撰寫升級測試
          [ -d app/schemas ] && cp -r app/schemas shots/ || true
          sha=$(git rev-parse --short HEAD)
          mkdir -p /tmp/pub && cp -r shots/. /tmp/pub/
          cd /tmp/pub
          echo "commit $sha · $(date -u +%FT%TZ)" > README.txt
          git init -q -b ui-shots
          git config user.name "ui-check"
          git config user.email "ui-check@users.noreply.github.com"
          git add -A && git commit -qm "UI shots for $sha"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ui-shots
