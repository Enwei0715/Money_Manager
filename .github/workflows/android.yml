name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 顯示用版本號（主.次.修訂），規則見 version.properties
      - name: Version
        run: |
          mm=$(grep '^versionMajorMinor=' version.properties | cut -d= -f2)
          base=$(grep '^patchBase=' version.properties | cut -d= -f2)
          patch=$(( ${{ github.run_number }} - base )); [ $patch -lt 0 ] && patch=0
          echo "APP_VERSION=$mm.$patch" >> "$GITHUB_ENV"

      # 固定簽章金鑰：Android 只允許「相同簽章」的新版覆蓋安裝。
      # 1. 有設定 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD）就用 Secrets。
      # 2. 否則使用存放在草稿 Release「signing-key」中的金鑰（只有對儲存庫有寫入權限的人看得到）；
      #    第一次執行時自動產生並上傳，之後每次建置都用同一把，因此可以直接覆蓋更新。
      - name: Restore signing key
        if: (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "使用 Secrets 中的簽章金鑰"
            exit 0
          fi
          echo "KEYSTORE_PASSWORD=mm-release-key" >> "$GITHUB_ENV"
          asset=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.draft and .name == "signing-key") | .assets[] | select(.name == "signing.jks") | .id] | first // empty')
          if [ -n "$asset" ]; then
            gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$asset" > app/release.jks
            echo "使用草稿 Release 中保存的簽章金鑰"
          else
            keytool -genkeypair -keystore app/release.jks -alias moneymanager -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass mm-release-key -keypass mm-release-key -dname "CN=Money Manager, O=Personal"
            mkdir -p /tmp/key && cp app/release.jks /tmp/key/signing.jks
            gh release create signing-key /tmp/key/signing.jks --repo "$REPO" --draft --title "signing-key" \
              --notes "App 簽章金鑰（自動產生）。請勿刪除：刪除後新版本將無法覆蓋安裝。" --target "${{ github.sha }}"
            rm -rf /tmp/key
            echo "已產生新的簽章金鑰並保存到草稿 Release"
          fi

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$SECRET_KEYSTORE_PASSWORD" ]; then export KEYSTORE_PASSWORD="$SECRET_KEYSTORE_PASSWORD"; fi
          # 兩個版本分開建置：同時建置時會一起寫 Room 的 schema 檔而互相干擾
          ./gradlew :app:assembleGithubRelease --no-daemon
          ./gradlew :app:bundlePlayRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/Ledgerly-${{ env.APP_VERSION }}.apk"
          # 上架 Google Play 用的 App Bundle（在 Play Console 上傳）
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "dist/Ledgerly-play-${{ env.APP_VERSION }}.aab"
          rm -f app/release.jks
          # 混淆對照表：還原閃退紀錄用（只放在建置成品，不附在 Release）
          cp app/build/outputs/mapping/githubRelease/mapping.txt "dist/mapping-${{ env.APP_VERSION }}.txt" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Ledgerly-${{ env.APP_VERSION }}
          path: dist/*

      # 只在預設分支發布 Release，驗證分支與 PR 不會產生正式版本。
      - name: Publish release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 更新說明：RELEASE_NOTES.md 在上一次發佈之後有改過才用它（最多 20 行），
          # 否則只寫一行固定文字，不把開發用的 commit 訊息放上去
          notes="・小幅修正與改善"
          lastTag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "$lastTag" ] && git fetch -q --no-tags --depth=200 origin "refs/tags/$lastTag:refs/tags/$lastTag" 2>/dev/null; then
            git diff --quiet "$lastTag" HEAD -- RELEASE_NOTES.md || notes="$(head -n 20 RELEASE_NOTES.md)"
          else
            notes="$(head -n 20 RELEASE_NOTES.md)"
          fi
          # 標籤結尾保留建置編號：舊版 App 依標籤最後的數字判斷有沒有新版
          gh release create "v${{ env.APP_VERSION }}-${{ github.run_number }}" dist/*.apk dist/*.aab \
            --title "帳理 Ledgerly ${{ env.APP_VERSION }}" \
            --target "${{ github.sha }}" \
            --notes "$notes"

      # 有設定 Play 服務帳戶金鑰（Secrets 的 PLAY_SERVICE_ACCOUNT_JSON）時，自動上傳到 Google Play 的內部測試軌道
      - name: Upload to Google Play (internal testing)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.enwei.moneymanager
          releaseFiles: dist/*.aab
          track: internal
          status: completed
