name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 簽章金鑰：優先使用 Secrets（KEYSTORE_BASE64 / KEYSTORE_PASSWORD）；
      # 未設定時改用快取的 debug 金鑰，讓連續版本仍可覆蓋安裝。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "使用 Secrets 中的簽章金鑰"
          else
            echo "::warning::未設定 KEYSTORE_BASE64，改用快取的 debug 金鑰簽章"
          fi

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MoneyManager-1.0.${{ github.run_number }}.apk"
          rm -f app/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyManager-1.0.${{ github.run_number }}
          path: dist/*.apk

      # main 分支每次更新都會發布 Release，App 內「檢查更新」即可下載安裝
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" dist/*.apk \
            --title "記帳本 1.0.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)"
